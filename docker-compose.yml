services:
  cartelier:
    build: .
    restart: unless-stopped
    ports:
      - "${CHALLENGE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      BOT_BASE_URL: http://127.0.0.1:3000
      FLAG: "${FLAG:-CTF{XSS_can_read_pages}}"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
